<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>McQuilter pattern tile: crosshatch (motif in white, overlaid on a base colour)</title>
  <defs><pattern id="crosshatch" width="20" height="20" patternUnits="userSpaceOnUse"><line x1="0" y1="20" x2="20" y2="0" stroke="rgba(255,255,255,0.35)" stroke-width="2"/><line x1="0" y1="0" x2="20" y2="20" stroke="rgba(255,255,255,0.35)" stroke-width="2"/></pattern></defs>
  <rect width="200" height="200" fill="#666666"/><rect width="200" height="200" fill="url(#crosshatch)"/>
</svg>
